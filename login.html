<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VYRO SPIN</title>

    <meta name="description" content="Ride stronger with VYRO SPIN, your indoor cycling and performance studio.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Urbanist:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Google Fonts and Font Awesome should be in <head>
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/auth.css">

</head>

<body class="vyro-auth-page">

    <header class="vyro-auth-toolbar">

        <div class="vyro-auth-preferences">
            <button type="button" class="vyro-auth-mode-btn" id="vyroDarkToggle" aria-pressed="false">
                <i class="fa-solid fa-moon" id="vyroDarkIcon" aria-hidden="true"></i>
            </button>

            <button type="button" class="vyro-auth-mode-btn" id="vyroRtlToggle" aria-pressed="false">
                <i class="fa-solid fa-right-left" aria-hidden="true"></i>
        </div>
    </header>

    <main class="vyro-auth-main">
        <section class="vyro-auth-card" aria-labelledby="vyroLoginTitle">

            <a href="index.html" class="vyro-auth-logo">
                <img src="images/logo.png" alt="VYRO SPIN"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            </a>

            <div class="vyro-auth-heading">
                <span class="vyro-auth-eyebrow">WELCOME BACK</span>
                <h1 id="vyroLoginTitle">LET'S GET YOU <span>BACK IN.</span></h1>
                <p>Log in to continue your VYRO SPIN journey.</p>
            </div>

            <form class="vyro-auth-form" id="vyroLoginForm">
                <div class="vyro-auth-field">
                    <label for="vyroLoginEmail">Email address</label>
                    <input type="email" id="vyroLoginEmail" name="email" placeholder="you@example.com"
                        autocomplete="email" required>
                </div>

                <div class="vyro-auth-field">
                    <label for="vyroLoginPassword">Password</label>
                    <div class="vyro-auth-password-wrap">
                        <input type="password" id="vyroLoginPassword" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="vyro-auth-eye" data-password-target="vyroLoginPassword"
                            aria-label="Show password" aria-pressed="false">

                            <i class="fa-regular fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="vyro-auth-options">
                    <label class="vyro-auth-remember">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="vyro-auth-text-link">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="vyro-auth-submit">
                    LOG IN <span aria-hidden="true">→</span>
                </button>

                <p class="vyro-auth-notice" id="vyroLoginNotice" role="status" aria-live="polite"></p>
            </form>

            <div class="vyro-auth-divider">
                <span></span>
                <p>OR CONTINUE WITH</p>
                <span></span>
            </div>

            <div class="vyro-auth-socials">
                <button type="button" class="vyro-auth-social vyro-auth-facebook" data-social="Facebook"
                    aria-label="Continue with Facebook">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor"
                            d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.8-.1-1.6-.2-2.5-.2-2.5 0-4.2 1.5-4.2 4.3v2.2H7.3V13h2.8v8h3.4Z" />
                    </svg>
                    <span>Facebook</span>
                </button>

                <button type="button" class="vyro-auth-social vyro-auth-google" data-social="Google"
                    aria-label="Continue with Google">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#4285F4"
                            d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z" />
                        <path fill="#34A853"
                            d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z" />
                        <path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4V15H5.8a20 20 0 0 0 0 18l6.8-5.3Z" />
                        <path fill="#EA4335"
                            d="M24 11.9c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4Z" />
                    </svg>
                    <span>Google</span>
                </button>

                <button type="button" class="vyro-auth-social vyro-auth-apple" data-social="Apple"
                    aria-label="Continue with Apple">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor"
                            d="M16.7 12.8c0-2.2 1.8-3.3 1.9-3.4a4.2 4.2 0 0 0-3.3-1.8c-1.4-.2-2.8.8-3.5.8s-1.8-.8-3-.8a4.5 4.5 0 0 0-3.8 2.3c-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.9-.7s1.8.7 2.9.7 1.9-1.1 2.6-2.3a10 10 0 0 0 1.2-2.5 3.9 3.9 0 0 1-1.8-3.8ZM14.4 6.1a4 4 0 0 0 .9-2.9 4.1 4.1 0 0 0-2.7 1.4 3.8 3.8 0 0 0-.9 2.8 3.4 3.4 0 0 0 2.7-1.3Z" />
                    </svg>
                    <span>Apple</span>
                </button>
            </div>

            <p class="vyro-auth-register">
                Don't have an account?
                <a href="register.html">Create account</a>
            </p>

        </section>
    </main>

    <script src="js/auth.js"></script>

</body>

</html>
